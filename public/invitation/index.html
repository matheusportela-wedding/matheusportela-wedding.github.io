<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anna &amp; Matheus — You're Invited</title>
  <meta name="description" content="Anna & Matheus — Wedding invitation." />
  <style>
    :root {
      --ew: clamp(230px, 60vw, 340px);          /* envelope width */
      --eh: calc(var(--ew) / 0.7135);            /* envelope height (matches the art aspect) */
      --hinge: 48.766%;                          /* flap fold line within the art */
      --soft: cubic-bezier(0.45, 0.05, 0.2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      background: #f4efdc url("./assets/backdrop.webp") center center / cover no-repeat;
      overflow: hidden;
      font-family: 'EB Garamond', Georgia, serif;
      -webkit-tap-highlight-color: transparent;
    }
    .stage {
      position: relative;
      width: min(100vw, 560px); height: 100svh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* the "camera": starts framed on the closed envelope, then zooms in and pans up
       to the letter. The letter never scales on its own — its readable size comes
       entirely from the camera zooming in. */
    .camera {
      position: relative;
      width: var(--ew); height: var(--eh);
      perspective: 1700px; perspective-origin: 50% 46%;
      transform-origin: 50% 50%;
      transform: translateY(-20%) scale(1.15);    /* framed on the closed envelope */
    }
    /* shared 3D space holding the envelope + the letter */
    .scene {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transform: rotateX(4deg);
    }
    .layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; -webkit-user-drag: none; user-select: none; pointer-events: none;
    }

    /* envelope pieces, stacked back → front via translateZ */
    .env-backbase { transform: translateZ(0px); }           /* inside back + green liner */
    .flap-shadow  { transform: translateZ(0.4px); opacity: 0; filter: blur(9px); }
    .env-cover    { transform: translateZ(6px); }            /* front pocket — hides the letter's lower half */
    /* one physical, two-sided flap hinged at the fold line:
       - front face = green liner (inner)
       - back face  = cream (outer), turned around with rotateY(180) so it is the reverse side
       rotateX(180deg) = CLOSED (cream apex-down over the throat); rotateX(0deg) = OPEN (green apex-up). */
    .flap {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transform-origin: 50% var(--hinge);
      transform: translateZ(8px) rotateX(180deg);            /* CLOSED */
    }
    .flap img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      -webkit-user-drag: none; pointer-events: none;
    }
    .flap-inner { /* green liner — front face */ }
    .flap-outer { transform: rotateY(180deg); }              /* cream outer — reverse side */

    /* the invitation letter */
    .letter {
      position: absolute; left: 6%; top: 0; width: 88%;
      aspect-ratio: 0.7135; object-fit: contain;
      transform-origin: 50% 50%;
      /* stored: sideways, fills the envelope, low & BEHIND the front pocket (z below .env-cover) */
      transform: translateY(31%) translateZ(3px) rotate(-90deg) scale(0.72);
      filter: drop-shadow(0 0 0 rgba(40, 46, 30, 0));
      -webkit-user-drag: none;
    }

    /* ====================== animation ====================== */
    .stage.is-playing .camera     { animation: camera-move 5s var(--soft) forwards; }
    .stage.is-playing .flap       { animation: flap-open   5s var(--soft) forwards; }
    .stage.is-playing .flap-shadow{ animation: shadow-in   5s var(--soft) forwards; }
    .stage.is-playing .letter     { animation: letter-out  5s var(--soft) forwards; }

    @keyframes camera-move {          /* dolly in + pan up: closed envelope -> the letter.
                                         zoom stays moderate while the letter rotates (so its corners
                                         don't clip the frame), then pushes in hard on the upright card. */
      0%, 6% { transform: translateY(-20%) scale(1.15); }  /* centered on the closed envelope */
      64%    { transform: translateY(34%)  scale(1.5); }   /* tracking the letter as it rotates upright */
      100%   { transform: translateY(64%)  scale(2.35); }  /* pushed in: the card fills most of the screen */
    }

    @keyframes flap-open {            /* single physical flap rotates open: cream outside → green inside.
                                         180deg -> 360deg sweeps the tip UP TOWARD THE VIEWER (not away),
                                         so it reads as a real 3D flip instead of shrinking/growing.
                                         translateZ 8 -> 1 drops the opened flap BEHIND the rising letter
                                         (and snug to the back, closing the throat gap). */
      0%, 6%   { transform: translateZ(8px) rotateX(180deg); }   /* closed: tip down, in front */
      28%,100% { transform: translateZ(1px) rotateX(360deg); }   /* open: tip swept toward viewer, then up & back */
    }
    @keyframes shadow-in {
      0%, 8%   { opacity: 0; }
      26%      { opacity: 0.16; }
      100%     { opacity: 0.10; }
    }
    /* the letter keeps a CONSTANT scale (0.72) — it never grows on its own; the camera zoom makes it big.
       It stays BEHIND the front pocket (z=3 < cover z=6) so the envelope hides it while it emerges,
       slides all the way OUT of the pocket, and only then rotates upright in clear space. */
    @keyframes letter-out {
      0%, 22%  { transform: translateY(31%)  translateZ(3px) rotate(-90deg) scale(0.72); filter: drop-shadow(0 0 0 rgba(40,46,30,0)); }
      50%      { transform: translateY(-28%) translateZ(3px) rotate(-90deg) scale(0.72); filter: drop-shadow(0 10px 16px rgba(40,46,30,0.16)); }
      70%,100% { transform: translateY(-28%) translateZ(3px) rotate(0deg)   scale(0.72); filter: drop-shadow(0 16px 24px rgba(40,46,30,0.26)); }
    }

    .tagline { position: absolute; left: 0; right: 0; bottom: clamp(18px,5vh,44px); text-align: center; opacity: 0; transition: opacity 0.8s ease; }
    .stage.is-done .tagline { opacity: 1; }
    .tagline a { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #3d4a2e; text-decoration: none; border-bottom: 1px solid rgba(61,74,46,0.4); padding-bottom: 3px; }

    .replay { position: absolute; right: clamp(14px,4vw,28px); bottom: clamp(14px,4vh,28px); width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 6px 18px -6px rgba(40,46,30,0.4); color: #546540; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.6s ease; }
    .replay.show { opacity: 1; }
    .replay svg { width: 22px; height: 22px; }

    @media (prefers-reduced-motion: reduce) {
      .stage.is-playing .camera, .stage.is-playing .flap,
      .stage.is-playing .flap-shadow, .stage.is-playing .letter { animation: none; }
      .camera { transform: translateY(64%) scale(2.35); }
      .scene .flap { transform: translateZ(1px) rotateX(0deg); }
      .scene .flap-shadow { opacity: 0.10; }
      .scene .letter { transform: translateY(-28%) translateZ(3px) rotate(0deg) scale(0.72); filter: drop-shadow(0 16px 24px rgba(40,46,30,0.26)); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="camera" id="camera">
      <div class="scene" id="scene">
        <img class="layer env-backbase" src="./assets/envelopeBackBase.webp" alt="" />
        <img class="letter" src="./assets/cardFront.webp" alt="Anna & Matheus wedding invitation" />
        <img class="layer flap-shadow" src="./assets/envelopeFrontFlapShadow.webp" alt="" />
        <img class="layer env-cover" src="./assets/envelopeBackCover.webp" alt="" />
        <div class="flap">
          <img class="flap-inner" src="./assets/envelopeBackFlap.webp" alt="" />
          <img class="flap-outer" src="./assets/envelopeFrontFlap.webp" alt="" />
        </div>
      </div>
    </div>

    <div class="tagline"><a href="/">Visit our wedding site</a></div>
    <button class="replay" id="replay" aria-label="Replay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
    </button>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var replay = document.getElementById('replay');
      var DURATION = 5000, doneTimer;
      function play() {
        stage.classList.remove('is-playing', 'is-done');
        replay.classList.remove('show');
        void stage.offsetWidth;
        stage.classList.add('is-playing');
        clearTimeout(doneTimer);
        doneTimer = setTimeout(function () { stage.classList.add('is-done'); replay.classList.add('show'); }, DURATION);
      }
      replay.addEventListener('click', function (e) { e.stopPropagation(); play(); });
      stage.addEventListener('click', function () { if (replay.classList.contains('show')) play(); });
      window.addEventListener('load', function () { setTimeout(play, 600); });
    })();
  </script>
</body>
</html>
